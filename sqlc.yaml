version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/migrations/sql"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_empty_slices: true
        overrides:
          # Send jsonb columns to the browser as JSON, not base64 bytes.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
